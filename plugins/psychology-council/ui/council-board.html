<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>心理学十二镜议会</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: light-dark(#241f2c, #f4f0f8);
      --muted: light-dark(#70677c, #bdb3c8);
      --paper: light-dark(#fbf9fc, #1d1922);
      --panel: light-dark(#ffffff, #27212e);
      --line: light-dark(#e6dfeb, #403747);
      --deep: #8f5b78;
      --action: #3d7f78;
      --growth: #b9783e;
      --relation: #5f69a6;
      --accent: #76558e;
      --shadow: 0 10px 32px color-mix(in srgb, var(--ink) 9%, transparent);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--deep) 10%, transparent), transparent 32%),
        radial-gradient(circle at 95% 10%, color-mix(in srgb, var(--action) 10%, transparent), transparent 30%),
        var(--paper);
      color: var(--ink);
      font: 14px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 22px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(23px, 4vw, 36px); line-height: 1.15; margin-bottom: 7px; letter-spacing: -.03em; }
    h2 { font-size: 16px; margin-bottom: 12px; }
    h3 { font-size: 14px; margin-bottom: 6px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .status { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }
    .badge, .lens {
      border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px;
      background: color-mix(in srgb, var(--panel) 86%, transparent); white-space: nowrap;
    }
    .privacy { color: var(--action); border-color: color-mix(in srgb, var(--action) 45%, var(--line)); }
    .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 16px; }
    .stack { display: grid; gap: 16px; }
    .card {
      background: color-mix(in srgb, var(--panel) 95%, transparent);
      border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow);
    }
    .chambers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .chamber { border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 120px; }
    .chamber[data-key="深层动力院"] { border-top: 4px solid var(--deep); }
    .chamber[data-key="行动改变院"] { border-top: 4px solid var(--action); }
    .chamber[data-key="意义成长院"] { border-top: 4px solid var(--growth); }
    .chamber[data-key="关系系统院"] { border-top: 4px solid var(--relation); }
    .lens-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .lens { font-size: 12px; opacity: .58; }
    .lens.selected { opacity: 1; color: #fff; background: var(--accent); border-color: transparent; }
    .claim { border-left: 3px solid var(--accent); padding: 8px 0 8px 11px; margin: 9px 0; }
    .claim-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .claim p, .value p { margin-bottom: 5px; }
    .detail { color: var(--muted); font-size: 12px; }
    .tension { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 9px; padding: 10px 0; border-top: 1px solid var(--line); }
    .tension:first-of-type { border-top: 0; }
    .versus { color: var(--accent); font-weight: 800; }
    .question { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
    .value { border: 1px solid var(--line); border-radius: 13px; padding: 11px; margin-top: 9px; }
    .meter { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 7px; }
    .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--growth), var(--accent)); }
    ul { margin: 0; padding-left: 19px; }
    li + li { margin-top: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      appearance: none; border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px;
      background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; border-color: transparent; }
    button:hover { transform: translateY(-1px); }
    .empty { color: var(--muted); padding: 10px 0; }
    footer { color: var(--muted); font-size: 11px; margin-top: 16px; text-align: center; }
    @media (max-width: 760px) {
      main { padding: 14px; }
      header, .grid { display: block; }
      .status { justify-content: flex-start; margin-top: 12px; }
      .grid > * + * { margin-top: 14px; }
      .chambers { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Psychology Council</div>
        <h1 id="topic">心理学十二镜议会</h1>
        <p id="goal" class="muted">等待议会数据。</p>
      </div>
      <div id="status" class="status"></div>
    </header>

    <div class="grid">
      <section class="stack">
        <div class="card">
          <h2>四院席位</h2>
          <div id="chambers" class="chambers"></div>
        </div>
        <div class="card">
          <h2>主张与证据边界</h2>
          <div id="claims" class="empty">尚未记录主张。</div>
        </div>
        <div class="card">
          <h2>关键张力</h2>
          <div id="tensions" class="empty">尚未形成需要保留的分歧。</div>
        </div>
      </section>

      <aside class="stack">
        <div class="card">
          <h2>价值地图</h2>
          <div id="values" class="empty">只显示你已经确认的价值。</div>
        </div>
        <div class="card">
          <h2>开放问题</h2>
          <div id="questions" class="empty">等待下一轮。</div>
          <div class="actions">
            <button class="primary" data-prompt="让入选人物先准确复述对手的最强观点，再进行反驳。">钢人化后反驳</button>
            <button data-prompt="请进入价值实验室，围绕当前最关键的价值冲突问我一到三个问题。">探索价值冲突</button>
            <button data-prompt="请引入当前最缺失的现代空席，并说明它会怎样改变已有判断。">引入现代空席</button>
          </div>
        </div>
        <div class="card">
          <h2>行动实验</h2>
          <div id="experiments" class="empty">尚未提出行动实验。</div>
        </div>
      </aside>
    </div>
    <footer>理论代理不是本人意识；本工具用于反思与决策，不用于诊断、治疗或危机支持。临时状态默认不写入磁盘。</footer>
  </main>

  <script>
    const pending = new Map();
    let requestId = 1;

    function request(method, params) {
      const id = requestId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function setList(container, items, emptyText) {
      container.replaceChildren();
      if (!Array.isArray(items) || items.length === 0) {
        container.className = "empty";
        container.textContent = emptyText;
        return;
      }
      container.className = "";
      const list = el("ul");
      items.forEach(item => list.appendChild(el("li", "", item)));
      container.appendChild(list);
    }

    function render(payload) {
      const session = payload?.session;
      const reference = payload?.reference;
      if (!session || !reference) return;

      document.getElementById("topic").textContent = session.topic || "心理学十二镜议会";
      document.getElementById("goal").textContent = session.goal || "";

      const status = document.getElementById("status");
      status.replaceChildren(
        el("span", "badge", session.phase || "定框"),
        el("span", "badge", `第 ${session.round || 0} 轮`),
        el("span", "badge privacy", session.persistence === "ephemeral" ? "临时·未保存" : "已保存去标识化摘要")
      );

      const chambers = document.getElementById("chambers");
      chambers.replaceChildren();
      const selected = new Set(session.selected_lenses || []);
      Object.entries(reference.chambers || {}).forEach(([name, members]) => {
        const box = el("section", "chamber");
        box.dataset.key = name;
        box.appendChild(el("h3", "", name));
        const list = el("div", "lens-list");
        members.forEach(member => list.appendChild(el("span", `lens${selected.has(member) ? " selected" : ""}`, member)));
        box.appendChild(list);
        chambers.appendChild(box);
      });

      const claims = document.getElementById("claims");
      claims.replaceChildren();
      if (!session.claims?.length) {
        claims.className = "empty";
        claims.textContent = "尚未记录主张。";
      } else {
        claims.className = "";
        session.claims.forEach(item => {
          const box = el("article", "claim");
          const meta = el("div", "claim-meta");
          [item.lens, item.label, item.status, item.evidence_level].filter(Boolean).forEach(x => meta.appendChild(el("span", "badge", x)));
          box.append(meta, el("p", "", item.statement));
          if (item.falsifier) box.appendChild(el("div", "detail", `会改变判断：${item.falsifier}`));
          if (item.challenge) box.appendChild(el("div", "detail", `主要质疑：${item.challenge}`));
          claims.appendChild(box);
        });
      }

      const tensions = document.getElementById("tensions");
      tensions.replaceChildren();
      if (!session.tensions?.length) {
        tensions.className = "empty";
        tensions.textContent = "尚未形成需要保留的分歧。";
      } else {
        tensions.className = "";
        session.tensions.forEach(item => {
          const row = el("div", "tension");
          row.append(el("div", "", item.left), el("div", "versus", "↔"), el("div", "", item.right));
          if (item.question) row.appendChild(el("div", "question", item.question));
          tensions.appendChild(row);
        });
      }

      const values = document.getElementById("values");
      values.replaceChildren();
      if (!session.values?.length) {
        values.className = "empty";
        values.textContent = "只显示你已经确认的价值。";
      } else {
        values.className = "";
        session.values.forEach(item => {
          const box = el("article", "value");
          box.appendChild(el("h3", "", item.name));
          if (item.meaning) box.appendChild(el("p", "", item.meaning));
          if (item.conflicts_with) box.appendChild(el("div", "detail", `冲突：${item.conflicts_with}`));
          if (item.willing_cost) box.appendChild(el("div", "detail", `愿意承担：${item.willing_cost}`));
          if (item.boundary) box.appendChild(el("div", "detail", `边界：${item.boundary}`));
          if (Number.isFinite(item.certainty)) {
            const meter = el("div", "meter");
            const fill = el("i");
            fill.style.width = `${Math.max(0, Math.min(100, item.certainty))}%`;
            meter.appendChild(fill);
            box.append(meter, el("div", "detail", `当前确定度 ${item.certainty}%（不代表正确率）`));
          }
          values.appendChild(box);
        });
      }

      setList(document.getElementById("questions"), session.open_questions, "等待下一轮。");
      setList(document.getElementById("experiments"), session.actions, "尚未提出行动实验。");
    }

    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) {
        const callback = pending.get(message.id);
        pending.delete(message.id);
        message.error ? callback.reject(message.error) : callback.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-result") {
        render(message.params?.structuredContent);
      }
    }, { passive: true });

    document.querySelectorAll("button[data-prompt]").forEach(button => {
      button.addEventListener("click", async () => {
        const text = button.dataset.prompt;
        try {
          if (window.openai?.sendFollowUpMessage) {
            await window.openai.sendFollowUpMessage({ prompt: text });
          } else {
            await request("ui/message", { role: "user", content: [{ type: "text", text }] });
          }
        } catch (_) {
          button.textContent = "请在对话框中输入此指令";
        }
      });
    });

    if (window.openai?.toolOutput) render(window.openai.toolOutput);
  </script>
</body>
</html>
